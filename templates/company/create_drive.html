{% extends "base.html" %}
{% block title %}Create Drive — {{ company.company_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title mb-4">Create Placement Drive</h3>

                <form method="POST" action="">
                    <div class="mb-3">
                        <label class="form-label">Job Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="job_title" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Job Description</label>
                        <textarea class="form-control" name="job_description" rows="4"
                                  placeholder="Describe the role, responsibilities..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Eligibility Criteria</label>
                        <input type="text" class="form-control" name="eligibility_criteria"
                               placeholder="e.g. Min 7.5 CGPA, B.Tech CSE">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Salary / CTC</label>
                            <input type="text" class="form-control" name="salary"
                                   placeholder="e.g. 6 LPA">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Location</label>
                            <input type="text" class="form-control" name="location"
                                   placeholder="e.g. Bangalore">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Application Deadline <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" name="application_deadline" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            Submit for Approval
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
