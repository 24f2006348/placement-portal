{% extends "base.html" %}
{% block title %}Edit Drive{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title mb-4">Edit Drive</h3>

                <form method="POST" action="">
                    <div class="mb-3">
                        <label class="form-label">Job Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="job_title"
                               value="{{ drive.job_title }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Job Description</label>
                        <textarea class="form-control" name="job_description"
                                  rows="4">{{ drive.job_description or '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Eligibility Criteria</label>
                        <input type="text" class="form-control" name="eligibility_criteria"
                               value="{{ drive.eligibility_criteria or '' }}">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Salary / CTC</label>
                            <input type="text" class="form-control" name="salary"
                                   value="{{ drive.salary or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Location</label>
                            <input type="text" class="form-control" name="location"
                                   value="{{ drive.location or '' }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Application Deadline <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" name="application_deadline"
                               value="{{ drive.application_deadline }}" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            Update & Resubmit for Approval
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
