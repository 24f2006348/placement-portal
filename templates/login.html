
{% extends "base.html" %}

{% block title %}Login — Placement Portal{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">


        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h3 class="card-title text-center mb-4">Login</h3>

                <form method="POST" action="">

                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>

                        <input 
                            type="email" 
                            class="form-control" 
                            id="email" 
                            name="email" 
                            placeholder="you@example.com"
                            required
                        >

                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <!-- 
                            WHY type="password"?
                            Hides characters as the user types.
                            Without this, password is visible on screen.
                        -->
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Login
                    </button>

                </form>

                <div class="text-center mt-3">
                    <small>
                        New student? 
                        <a href="{{ url_for('auth.register_student') }}">Register here</a>
                    </small>
                </div>
                <div class="text-center mt-1">
                    <small>
                        Registering a company? 
                        <a href="{{ url_for('auth.register_company') }}">Company registration</a>
                    </small>
                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
