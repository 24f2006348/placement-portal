{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title mb-4">Edit Profile</h3>

                <form method="POST" action="" enctype="multipart/form-data">

                    <h6 class="text-muted mb-3">Personal Information</h6>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="full_name"
                                   value="{{ student.full_name or '' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Roll Number</label>
                            <input type="text" class="form-control" name="roll_no"
                                   value="{{ student.roll_no or '' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Degree</label>
                            <select class="form-select" name="degree">
                                <option value="">-- Select --</option>
                                {% for deg in ['B.Tech','M.Tech','MBA','MCA','BSc','MSc','PhD'] %}
                                <option value="{{ deg }}"
                                    {% if student.degree == deg %}selected{% endif %}>
                                    {{ deg }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Department</label>
                            <input type="text" class="form-control" name="department"
                                   value="{{ student.department or '' }}"
                                   placeholder="e.g. Computer Science">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Year</label>
                            <input type="number" class="form-control" name="year"
                                   value="{{ student.year or '' }}" min="1" max="5">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">CGPA</label>
                            <input type="number" class="form-control" name="cgpa"
                                   value="{{ student.cgpa or '' }}"
                                   min="0" max="10" step="0.01">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Phone</label>
                            <input type="tel" class="form-control" name="phone"
                                   value="{{ student.phone or '' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Skills</label>
                        <textarea class="form-control" name="skills" rows="2"
                                  placeholder="e.g. Python, Flask, SQL">{{ student.skills or '' }}</textarea>
                    </div>

                    <hr>
                    <h6 class="text-muted mb-3">Resume</h6>

                    {% if student.resume_path %}
                    <div class="mb-2">
                        <small class="text-success">
                            ✅ Current resume:
                            <a href="/static/uploads/{{ student.resume_path }}"
                               target="_blank">View</a>
                        </small>
                    </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label">
                            Upload New Resume
                            <small class="text-muted">(PDF, DOC, DOCX only)</small>
                        </label>
                        <input type="file" class="form-control" name="resume"
                               accept=".pdf,.doc,.docx">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            Save Profile
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
